spring.application.name=backend

# Configuración acceso a la base de datos (Local)

spring.datasource.url=jdbc:mysql://localhost:3307/app_gestion_autonoma
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update

# Configuración validación por tokens

jwt.secret=${JWT_SECRET} 

## Accesible cómo variable de entorno: setx N_Variable "valor_variable"

jwt.expiration=900000
jwt.refresh.expiration=604800000