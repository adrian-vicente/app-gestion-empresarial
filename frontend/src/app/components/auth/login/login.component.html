<div class="login-container">

  <!-- Card que muestra los campos para iniciar sesión -->

  <div class="login-card">

    <!-- Presentación antes de los campos -->

    <h1>Iniciar sesión</h1>
    <p>Accede a tu cuenta</p>

    <!-- Formulario con los campos para iniciar sesión -->

    <form (ngSubmit)="iniciarSesion()" >

      <!-- Campo para introducir el correo electrónico -->

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Introduce tu correo electrónico" required>
      </div>

      <!-- Campo para introducir la password -->

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Introduce tu password para iniciar sesión" required="">
      </div>

      <!-- Mostrar el campo del error en caso de que se produzca uno al iniciar sesión -->

      @if (error) {
        <p class="error">{{ error }}</p>

      }

      <!-- Botón para mandar el formulario e iniciar sesión en la cuenta -->

      <button type="submit"> Iniciar sesión </button>

    </form>

  </div>

</div>
